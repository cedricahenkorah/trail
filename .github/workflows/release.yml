name: release

# Release by either:
#   - Actions → release → Run workflow, choosing patch/minor/major
#     (or: gh workflow run release -f bump=minor)
#   - pushing a tag yourself: git tag v0.2.0 && git push origin v0.2.0
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the latest tag"
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual releases must run on main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push the next tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "Tag $next already exists."
            exit 1
          fi

          echo "Releasing $next (previous: $latest)"
          git tag "$next"
          git push origin "$next"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
